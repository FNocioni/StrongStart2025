<!DOCTYPE html>

<!--To start HTTP Server: python -m http.server 5000-->

<html>
    <head>
        <!--Import Google Icon Font-->
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <!--Import materialize.css-->
        <link type="text/css" rel="stylesheet" href="css/materialize.css"  media="screen,projection"/>
        <link type="text/css" rel="stylesheet" href="css/login.css">
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <!--Let browser know website is optimized for mobile-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </head>

    <body class="background" background="images/background.png">

        <div class="login">
            <div class="col s12" id="login_form">
				<div class="row">
					<div class="col s6 offset-s11" style="justify-content: center; display: flex;">
						<li class="registerInstead"><a href="register.html">Register Instead</a></li>
					</div>
				</div>
                <img src="images/logo.png" width="300" height="300" style="display: block; margin-left: auto; margin-right: auto;">
                <div class="row">
                    <div class="input-field col s12">
                        <input id="username" type="text">
                        <label for="username">Username</label>
                        <span class="helper-text" data-error="Incorrect Username/Password">Helper text</span>
                    </div>
                </div>
                <div class="row">
                    <div class="input-field col s12">
                        <input id="password" type="password">
                        <label for="password">Password</label>
                        <span class="helper-text" data-error="Incorrect Username/Password">Helper text</span>
                    </div>
                </div>
                <div class="row">
                    <div class="col s6 offset-s3" style="justify-content: center; display: flex;">
                        <button class="btn waves-effect waves-light" id="submit_button" type="submit" onclick=login() disabled="true">Submit
                            <i class="material-icons right">send</i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!--JavaScript at end of body for optimized loading-->
        <script type="text/javascript" src="js/materialize.js"></script>
        <script type="text/javascript" src="js/login.js"></script>

    </body>

    <footer class="page-footer">
        <div class="container">
            <div class="row">
            <div class="col l6 s12">
                <h5 class="white-text">Numa Capital</h5>
                <div style="display:flex; justify-content: left;">
                    <i class="material-icons dp48">
                        copyright
                    </i>
                    &nbsp;2025 Copyright Numa Capital
                </div>
            </div>
            <div class="col l4 offset-l2 s12">
                <h5 class="white-text">Links</h5>
                <ul>
                <li><a class="grey-text text-lighten-3" href="about.html">About Numa Capital</a></li>
                </ul>
            </div>
            </div>
        </div>
    </footer>



</html>
