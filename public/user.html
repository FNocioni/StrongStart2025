<!DOCTYPE html>
<html>
    <head>
        <!--Import Google Icon Font-->
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <!--Import materialize.css-->
        <link type="text/css" rel="stylesheet" href="css/materialize.css"  media="screen,projection"/>
        <link type="text/css" rel="stylesheet" href="css/user.css">
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <!--Let browser know website is optimized for mobile-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </head>

    <body class="background" background="images/dashboard_background.jpg">
        <nav>
            <div class="nav-wrapper">
            <a id="user" class="brand-logo"></a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <button id="userPageButton" class="redirectButton">Dashboard</button>
                <button id="loginPageButton" class="redirectButton">Login</button>
                <button id="registerPageButton" class="redirectButton">Register</button>
                <button id="settingsPageButton" class="redirectButton">Settings  ⚙</button>
            </ul>
            </div>
        </nav>
		<div id="dashboardContent">
			<div class="spendings">
				<div class="spendingsTitle">
					Spendings
				</div>
				<div id="spendingsInfoDiv">
					<p class="transactionItem">
					LOADING USER TRANSACTIONS...
					</p>
				</div>
			</div>
			<div id="chartjsDiv">
				<div id="chartjsDivRow">
					<!--this specific chratjsDivRow will be updated/modified by user.js-->
					<button id="renderLeftChartAsImageButton" class="chartjsOptionsButton">Download Graph</button>
					<button id="alternateChartsButton" class="chartjsOptionsButton">Alternate View</button>
					<button id="renderRightChartAsImageButton" class="chartjsOptionsButton">Download Doughnut</button>
				</div>
				<div id="chartjsDivRow">
					<div id="leftChartDiv">
						<!--chart will be rendered by user.js-->
						<canvas id="leftChart"></canvas>
					</div>
					<div id="rightChartDiv">
						<!--chart will be rendered by user.js-->
						<canvas id="rightChart"></canvas>
					</div>
				</div>
			</div>
		</div>

        <!--JavaScript at end of body for optimized loading-->
        <script type="text/javascript" src="js/materialize.js"></script>
        <script type="text/javascript" src="js/user.js"></script>
    </body>

    <footer class="page-footer">
        <div class="container">
            <div class="row">
            <div class="col l6 s12">
                <h5 class="white-text">Numa Capital</h5>
                <div style="display:flex; justify-content: left;">
                    <i class="material-icons dp48">
                        copyright
                    </i>
                    &nbsp;2025 Copyright Numa Capital
                </div>
            </div>
            <div class="col l4 offset-l2 s12">
                <h5 class="white-text">Links</h5>
                <ul>
                <li><a class="grey-text text-lighten-3" href="about.html">About Numa Capital</a></li>
                </ul>
            </div>
            </div>
        </div>
    </footer>
</html>
